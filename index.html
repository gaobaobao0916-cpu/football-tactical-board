<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时足球战术板 · 个人驾驶舱</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #f5f5f5; color: #1a1a1a; line-height: 1.5; padding: 0;
}
.app { max-width: 1600px; margin: 0 auto; padding: 16px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
.header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.live-dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.status-bar { display: flex; gap: 16px; align-items: center; font-size: 12px; color: #666; flex-wrap: wrap; }
.status-item { background: #fff; padding: 6px 12px; border-radius: 6px; border: 1px solid #e5e5e5; white-space: nowrap; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.btn {
  padding: 8px 16px; border: 1px solid #d4d4d4; border-radius: 8px; cursor: pointer;
  background: #fff; font-size: 13px; font-weight: 500; transition: all 0.15s;
  display: flex; align-items: center; gap: 4px;
}
.btn:hover { background: #f0f0f0; border-color: #aaa; }
.btn-primary { background: #2563eb; color: #fff; border-color: #2563eb; }
.btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
.btn-danger { color: #dc2626; border-color: #fca5a5; }
.btn-danger:hover { background: #fef2f2; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

.table-wrap { background: #fff; border-radius: 12px; border: 1px solid #e5e5e5; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1650px; }
th { background: #f8fafc; padding: 10px 8px; text-align: center; font-weight: 600; font-size: 12px;
  color: #475569; border-bottom: 2px solid #e2e8f0; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
td { padding: 8px; text-align: center; border-bottom: 1px solid #f1f5f9; white-space: nowrap; }
tr:hover { background: #f8fafc; }
.row-warn { background: #fef9c3 !important; }
.row-warn:hover { background: #fef08a !important; }
.row-blue { background: #dbeafe !important; }
.row-blue:hover { background: #bfdbfe !important; }
.row-normal { background: #fff; }

.badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.badge-warn { background: #fef9c3; color: #854d0e; }
.badge-blue { background: #dbeafe; color: #1e40af; }
.badge-none { color: transparent; }
.badge-live { background: #dcfce7; color: #166534; }
.badge-finished { background: #f1f5f9; color: #64748b; }
.badge-upcoming { background: #fef3c7; color: #92400e; }

.match-time { font-weight: 600; color: #dc2626; }
.score { font-weight: 700; font-size: 14px; letter-spacing: 2px; }
.team-name { font-weight: 600; }
.home-team { color: #1e40af; }
.away-team { color: #64748b; }
.stat-ratio { font-family: 'SF Mono', 'Consolas', 'Courier New', monospace; font-size: 12px; }
.stat-high { color: #dc2626; font-weight: 600; }

.form-overlay { display: none; position: fixed; inset:0; background: rgba(0,0,0,0.4); z-index: 100;
  justify-content: center; align-items: center; }
.form-overlay.active { display: flex; }
.form-panel { background: #fff; border-radius: 16px; padding: 24px; width: 520px; max-width: 95vw;
  max-height: 90vh; overflow-y: auto; }
.form-panel h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label { font-size: 12px; font-weight: 500; color: #475569; }
.form-group input, .form-group select {
  padding: 8px 10px; border: 1px solid #d4d4d4; border-radius: 6px; font-size: 13px;
  outline: none; transition: border 0.15s;
}
.form-group input:focus, .form-group select:focus { border-color: #2563eb; }
.form-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }

.empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
.empty-state h2 { font-size: 16px; margin-bottom: 8px; color: #64748b; }
.empty-state p { font-size: 13px; }
.help-tip { font-size: 11px; color: #94a3b8; margin-top: 4px; }
.total-row { background: #f1f5f9; font-weight: 600; }
.total-row td { border-top: 2px solid #e2e8f0; }

.auto-refresh-badge { animation: spin 2s linear infinite; display: inline-block; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.import-preview-list { max-height: 300px; overflow-y: auto; margin: 12px 0; }

/* ---- 滚球大球评分系统 ---- */
.row-over-strong { border-left: 4px solid #22c55e !important; }
.row-over-moderate { border-left: 4px solid #eab308 !important; }
.row-over-watch { border-left: 4px solid #94a3b8 !important; }
.row-over-skip { border-left: 4px solid #ef4444 !important; }

.over-score-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; min-width: 42px; transition: transform 0.1s; }
.over-score-badge:hover { transform: scale(1.05); }
.over-strong { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
.over-moderate { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
.over-watch { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; }
.over-skip { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
.over-blocked { background: #fecaca; color: #7f1d1d; border: 1px solid #f87171; text-decoration: line-through; }

.over-detail { font-size: 12px; line-height: 1.8; }
.over-detail-bar { height: 6px; border-radius: 3px; background: #e5e7eb; margin: 4px 0; overflow: hidden; }
.over-detail-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.over-detail-item { display: flex; justify-content: space-between; padding: 2px 0; }
.over-detail-label { color: #475569; }
.over-detail-val { font-weight: 600; }
.over-detail-val.max { color: #16a34a; }
.over-detail-val.high { color: #2563eb; }
.over-detail-val.mid { color: #d97706; }
.over-detail-val.low { color: #dc2626; }

.over-terminate { background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 8px 12px; margin-top: 8px; font-size: 12px; color: #991b1b; }

@media (max-width: 768px) {
  .over-detail { font-size: 11px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>
      <span class="live-dot"></span>
      实时足球战术板
      <span style="font-size:13px;font-weight:400;color:#64748b;">个人驾驶舱 v1.0</span>
    </h1>
    <div class="status-bar">
      <div class="status-item">📡 最近更新: <span id="lastUpdate">--</span></div>
      <div class="status-item">🔄 自动刷新: <span id="refreshInterval">60秒</span></div>
      <div class="status-item">📊 监控中: <span id="matchCount">0</span> 场</div>
      <div class="status-item">⚠️ 预警: <span id="alertCount">0</span> 场</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" onclick="openAddForm()">+ 添加比赛</button>
    <button class="btn" onclick="quickAddDemo()">📋 载入演示数据</button>
    <button class="btn btn-primary" onclick="document.getElementById('importFile').click()">📥 导入JSON</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
    <button class="btn" onclick="manualRefresh()">🔄 立即刷新</button>
    <button class="btn" onclick="toggleAutoRefresh()">⏯️ <span id="autoBtnText">暂停自动刷新</span></button>
    <button class="btn btn-danger btn-sm" onclick="clearAll()">🗑 清空全部</button>
    <select id="intervalSelect" onchange="changeInterval()" style="margin-left:auto;padding:4px 8px;border-radius:6px;border:1px solid #d4d4d4;font-size:12px;">
      <option value="30">30秒刷新</option>
      <option value="60" selected>60秒刷新</option>
      <option value="120">120秒刷新</option>
      <option value="300">5分钟刷新</option>
    </select>
  </div>

  <div class="table-wrap">
    <table id="matchTable">
      <thead>
        <tr>
          <th>比赛时间</th>
          <th>联赛</th>
          <th>主队</th>
          <th>客队</th>
          <th>实时比分</th>
          <th>让球盘口</th>
          <th>大小球盘口</th>
          <th>射门比</th>
          <th>射正比</th>
          <th>危险进攻比</th>
          <th>xG (主/客)</th>
          <th>滚球大球评分</th>
          <th>追大结论</th>
          <th>压制判断</th>
          <th>均衡提示</th>
          <th>状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="17">
            <div class="empty-state">
              <h2>📋 尚无比赛数据</h2>
              <p>点击「添加比赛」录入一场比赛，或点击「载入演示数据」查看示例</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="form-overlay" id="formOverlay">
  <div class="form-panel">
    <h3 id="formTitle">添加比赛</h3>
    <div class="form-grid">
      <div class="form-group">
        <label>比赛分钟 ' </label>
        <input type="number" id="f_minute" placeholder="0-90+" min="0" max="120">
      </div>
      <div class="form-group">
        <label>联赛</label>
        <select id="f_league">
          <option value="英超">英超</option><option value="西甲">西甲</option><option value="德甲">德甲</option>
          <option value="意甲">意甲</option><option value="法甲">法甲</option><option value="中超">中超</option>
          <option value="欧冠">欧冠</option><option value="欧联">欧联</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>主队</label>
        <input type="text" id="f_home" placeholder="主队名称">
      </div>
      <div class="form-group">
        <label>客队</label>
        <input type="text" id="f_away" placeholder="客队名称">
      </div>
      <div class="form-group">
        <label>主队进球</label>
        <input type="number" id="f_homeGoal" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label>客队进球</label>
        <input type="number" id="f_awayGoal" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label>让球盘口</label>
        <input type="text" id="f_handicap" placeholder="如 -0.75 或 +0.25">
      </div>
      <div class="form-group">
        <label>大小球盘口</label>
        <input type="text" id="f_overUnder" placeholder="如 2.5">
      </div>
      <div class="form-group">
        <label>射门 (主:客)</label>
        <input type="text" id="f_shots" placeholder="如 7:2">
      </div>
      <div class="form-group">
        <label>射正 (主:客)</label>
        <input type="text" id="f_shotsOn" placeholder="如 4:1">
      </div>
      <div class="form-group">
        <label>危险进攻 (主:客)</label>
        <input type="text" id="f_dangerAttacks" placeholder="如 22:8">
      </div>
      <div class="form-group">
        <label>xG 主队</label>
        <input type="number" id="f_xgHome" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="form-group">
        <label>xG 客队</label>
        <input type="number" id="f_xgAway" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="form-group">
        <label>连续压制(分钟)</label>
        <input type="number" id="f_pressureMin" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label>近10分钟角球</label>
        <input type="number" id="f_corners" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label>红牌</label>
        <select id="f_redCard">
          <option value="">无</option>
          <option value="home">主队</option>
          <option value="away">客队</option>
          <option value="both">双方</option>
        </select>
      </div>
      <div class="form-group">
        <label>领先方控节奏</label>
        <select id="f_leaderControl">
          <option value="">无/未发生</option>
          <option value="slowdown">明显降速</option>
          <option value="continue">继续压制</option>
        </select>
      </div>
      <div class="form-group">
        <label>Live盘口变化</label>
        <select id="f_oddsMovement">
          <option value="">无变化/未知</option>
          <option value="up">升盘</option>
          <option value="stable">稳定</option>
          <option value="down">降盘</option>
        </select>
      </div>
    </div>
    <div class="help-tip">危险进攻比值会在录入时自动计算，用于均衡模型判断</div>
    <div class="form-actions">
      <input type="hidden" id="f_editId">
      <button class="btn" onclick="closeForm()">取消</button>
      <button class="btn btn-primary" onclick="saveMatch()">保存</button>
    </div>
  </div>
</div>

<!-- 导入预览弹窗 -->
<div class="form-overlay" id="importPreviewOverlay">
  <div class="form-panel">
    <h3>📥 导入比赛数据</h3>
    <div id="importPreviewContent" style="margin:8px 0;"></div>
    <div style="font-size:12px;color:#64748b;margin:8px 0;">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="checkbox" id="importReplace">
        替换现有数据 (不勾选则追加，自动跳过重复场次)
      </label>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="cancelImport()">取消</button>
      <button class="btn btn-primary" onclick="confirmImport()">确认导入 <span id="importPreviewCount">0</span> 场</button>
    </div>
  </div>
</div>

<!-- 滚球大球评分详情弹窗 -->
<div class="form-overlay" id="overDetailOverlay" onclick="if(event.target===this)closeOverDetail()">
  <div class="form-panel" style="width:580px;">
    <h3 id="overDetailTitle">滚球大球评分详情</h3>
    <div id="overDetailContent" class="over-detail"></div>
    <div class="form-actions">
      <button class="btn" onclick="closeOverDetail()">关闭</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'football_tactical_board_data';
let matches = [];
let autoRefreshTimer = null;
let autoRefreshEnabled = true;
let refreshSecs = 60;

function init() {
  loadData();
  startAutoRefresh();
  updateStats();
  const sel = document.getElementById('intervalSelect');
  sel.addEventListener('change', changeInterval);
  document.getElementById('formOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeForm();
  });
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) matches = JSON.parse(raw);
    else matches = [];
  } catch(e) { matches = []; }
  renderTable();
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(matches));
}

function parseRatio(str) {
  if (!str || typeof str !== 'string') return null;
  const parts = str.split(':');
  if (parts.length !== 2) return null;
  const home = parseFloat(parts[0].trim());
  const away = parseFloat(parts[1].trim());
  if (isNaN(home) || isNaN(away) || away === 0) return null;
  return { home, away, ratio: home / away };
}

function getMatchStatus(minuteStr) {
  const m = parseInt(minuteStr);
  if (isNaN(m) || m === 0) return 'upcoming';
  if (m >= 90 || minuteStr === 'FT' || minuteStr === '完赛') return 'finished';
  return 'live';
}

function getStatusBadge(status) {
  if (status === 'live') return '<span class="badge badge-live">进行中</span>';
  if (status === 'finished') return '<span class="badge badge-finished">已结束</span>';
  return '<span class="badge badge-upcoming">未开赛</span>';
}

// ===== 滚球大球评分系统 v1.0 (100分制) =====

function computeOverScore(m) {
  /*
   * 5大模块 100分制
   * 场面压制(35) + 节奏强度(25) + Live盘口(20) + 时间结构(10) + 风险过滤(10)
   * 终止条件: 任意触发 → 直接禁止
   */
  
  // === 基础数据提取 ===
  const minute = parseInt(m.minute) || 0;
  const status = getMatchStatus(m.minute);
  const danger = parseRatio(m.dangerAttacks);
  const dangerHome = danger ? danger.home : 0;
  const dangerAway = danger ? danger.away : 0;
  const dangerDiff = danger ? Math.abs(dangerHome - dangerAway) : 0;
  const dangerRatio = danger ? danger.ratio : 0;
  
  const shotsOn = parseRatio(m.shotsOn);
  const shotsOnDiff = shotsOn ? Math.abs(shotsOn.home - shotsOn.away) : 0;
  
  const shots = parseRatio(m.shots);
  
  const xgHome = parseFloat(m.xgHome) || 0;
  const xgAway = parseFloat(m.xgAway) || 0;
  const xgTotal = xgHome + xgAway;
  
  const overUnder = parseFloat(m.overUnder) || 2.5;
  
  // 手动补充字段
  const pressureMin = parseInt(m.pressureMin) || 0;
  const corners = parseInt(m.corners) || 0;
  const redCard = m.redCard || '';
  const leaderControl = m.leaderControl || '';
  const oddsMovement = m.oddsMovement || '';
  
  // === 终止条件检测 (优先级最高) ===
  let terminated = false;
  let terminateReasons = [];
  
  // 条件2: 盘口连续降盘
  if (oddsMovement === 'down') {
    terminated = true;
    terminateReasons.push('盘口连续降盘');
  }
  
  // 条件3: 射正停止增长 (xG极低但有大量射门 - 假压制)
  if (xgTotal < 0.3 && shots && (shots.home + shots.away) >= 8) {
    terminated = true;
    terminateReasons.push('射正停止增长(假压制)');
  }
  
  // 条件4: 领先方明显控节奏
  if (leaderControl === 'slowdown') {
    terminated = true;
    terminateReasons.push('领先方明显控节奏');
  }
  
  // 条件1: 红牌后死守
  if (redCard !== '') {
    terminated = true;
    terminateReasons.push('红牌(' + (redCard === 'home' ? '主队' : redCard === 'away' ? '客队' : '双方') + ')');
  }
  
  // 未开赛/已结束不评分
  if (status !== 'live') {
    return {
      score: 0, maxPossible: 100,
      breakdown: {},
      conclusion: (status === 'finished' ? '已结束' : '未开赛'),
      conclusionClass: 'over-watch',
      terminated: false, terminateReasons: [],
      details: { note: (status === 'finished' ? '比赛已结束' : '比赛未开赛') }
    };
  }
  
  // === 如果触发终止条件 ===
  if (terminated) {
    return {
      score: 0, maxPossible: 100,
      breakdown: {},
      conclusion: '禁止追大',
      conclusionClass: 'over-blocked',
      terminated: true, terminateReasons,
      details: { terminateReasons }
    };
  }
  
  let score = 0;
  let breakdown = {};
  
  // ==========================================
  // 模块1: 场面压制 (35分)
  // ==========================================
  let sceneScore = 0;
  
  // 1.1 危险进攻评分 (15分)
  let dangerScore = 0;
  if (dangerDiff >= 25) dangerScore = 15;
  else if (dangerDiff >= 15) dangerScore = 10;
  else if (dangerDiff >= 8) dangerScore = 5;
  sceneScore += dangerScore;
  breakdown['危险进攻差'] = [dangerDiff, dangerScore, 15];
  
  // 1.2 射正评分 (10分)
  let shotsOnScore = 0;
  if (shotsOnDiff >= 5) shotsOnScore = 10;
  else if (shotsOnDiff >= 3) shotsOnScore = 7;
  else if (shotsOnDiff >= 1) shotsOnScore = 3;
  sceneScore += shotsOnScore;
  breakdown['射正差'] = [shotsOnDiff, shotsOnScore, 10];
  
  // 1.3 xG评分 (10分)
  let xgScore = 0;
  if (xgTotal >= 2.0) xgScore = 10;
  else if (xgTotal >= 1.5) xgScore = 7;
  else if (xgTotal >= 1.0) xgScore = 4;
  sceneScore += xgScore;
  breakdown['xG总值'] = [xgTotal, xgScore, 10];
  
  score += sceneScore;
  
  // ==========================================
  // 模块2: 节奏强度 (25分)
  // ==========================================
  let rhythmScore = 0;
  
  // 2.1 连续压制时间 (10分) - 手动
  let pressureScore = 0;
  if (pressureMin >= 12) pressureScore = 10;
  else if (pressureMin >= 8) pressureScore = 7;
  else if (pressureMin >= 5) pressureScore = 4;
  rhythmScore += pressureScore;
  breakdown['连续压制'] = [pressureMin + 'min', pressureScore, 10];
  
  // 2.2 攻防转换速度 (8分) - 用危险进攻比近似
  let transitionScore = 0;
  if (dangerRatio >= 2.5 || dangerRatio <= 0.4) {
    transitionScore = 8;  // 单边持续压制 → 高速转换
  } else if (dangerRatio >= 1.5 || dangerRatio <= 0.67) {
    transitionScore = 6;  // 单边压制
  } else if (dangerRatio > 0) {
    transitionScore = 2;
  }
  rhythmScore += transitionScore;
  breakdown['攻防转换'] = ['比' + (dangerRatio ? dangerRatio.toFixed(1) : '?'), transitionScore, 8];
  
  // 2.3 角球压力 (7分) - 手动
  let cornerScore = 0;
  if (corners >= 4) cornerScore = 7;
  else if (corners >= 2) cornerScore = 4;
  rhythmScore += cornerScore;
  breakdown['角球(10min)'] = [corners + '个', cornerScore, 7];
  
  score += rhythmScore;
  
  // ==========================================
  // 模块3: Live盘口 (20分)
  // ==========================================
  let oddsScore = 0;
  
  // 3.1 盘口稳定/升降 (15分)
  let oddsStabilityScore = 0;
  let oddsStabilityLabel = '';
  
  // 用 dangerRatio + oddsMovement 组合判断
  const isHighRhythm = (dangerRatio >= 2.0 || dangerRatio <= 0.5) && dangerDiff >= 10;
  
  if (isHighRhythm && oddsMovement === 'up') {
    oddsStabilityScore = 15;
    oddsStabilityLabel = '快节奏+升盘';
  } else if (isHighRhythm && oddsMovement === 'stable') {
    oddsStabilityScore = 10;
    oddsStabilityLabel = '快节奏+稳定';
  } else if (isHighRhythm && oddsMovement === 'down') {
    oddsStabilityScore = -10;
    oddsStabilityLabel = '快节奏但降盘⚠';
  } else if (isHighRhythm && oddsMovement === '') {
    oddsStabilityScore = 5;
    oddsStabilityLabel = '快节奏(盘口未知)';
  }
  oddsScore += Math.max(-10, oddsStabilityScore);
  breakdown['盘口方向'] = [oddsStabilityLabel || '-', Math.max(-10, oddsStabilityScore), 15];
  
  // 3.2 大球水位 (5分) - 手动/近似
  let waterScore = 0;
  if (oddsMovement === 'up') waterScore = 5;
  else if (oddsMovement === 'stable') waterScore = 3;
  oddsScore += waterScore;
  breakdown['水位变化'] = [oddsMovement === 'up' ? '升至0.80↓' : oddsMovement === 'stable' ? '稳定' : '-', waterScore, 5];
  
  score += oddsScore;
  
  // ==========================================
  // 模块4: 时间结构 (10分)
  // ==========================================
  let timeScore = 0;
  if (minute >= 20 && minute <= 35) {
    timeScore = 5;
    breakdown['时间窗口'] = [minute + "' 最佳追大期", 5, 10];
  } else if (minute >= 50 && minute <= 70) {
    timeScore = 5;
    breakdown['时间窗口'] = [minute + "' 最佳追大期", 5, 10];
  } else if (minute > 70) {
    timeScore = 2;
    breakdown['时间窗口'] = [minute + "' 末段(谨慎)", 2, 10];
  } else {
    breakdown['时间窗口'] = [minute + "' 非最佳期", 0, 10];
  }
  score += timeScore;
  
  // ==========================================
  // 模块5: 风险过滤 (10分)
  // ==========================================
  let riskScore = 0;
  
  // 5.1 红牌过滤 (-15)
  let redCardScore = 0;
  if (redCard !== '') {
    redCardScore = -15;
    riskScore += redCardScore;
  }
  breakdown['红牌影响'] = [redCard || '无', redCardScore, 0];
  
  // 5.2 领先方控节奏 (-10)
  let leaderScore = 0;
  if (leaderControl === 'slowdown') leaderScore = -10;
  else if (leaderControl === 'continue') leaderScore = 5;
  riskScore += leaderScore;
  breakdown['领先方节奏'] = [leaderControl === 'slowdown' ? '明显降速' : leaderControl === 'continue' ? '继续压制' : '-', leaderScore, 0];
  
  // 5.3 假压制识别 (-10)
  let fakeScore = 0;
  const totalShots = shots ? (shots.home + shots.away) : 0;
  if (xgTotal < 0.8 && totalShots >= 8) {
    fakeScore = -10;
  }
  riskScore += fakeScore;
  breakdown['假压制检测'] = [(fakeScore < 0 ? 'xG<' + xgTotal.toFixed(1) + '但射门' + totalShots : '正常'), fakeScore, 0];
  
  // 5.4 基本风险保底 (10分封顶)
  riskScore = Math.max(-10, riskScore + 10);
  score += riskScore;
  
  // === 最终得分 (封顶100, 保底0) ===
  score = Math.max(0, Math.min(100, Math.round(score)));
  
  // === 结论判断 ===
  let conclusion, conclusionClass;
  if (score >= 75) { conclusion = '强追大球'; conclusionClass = 'over-strong'; }
  else if (score >= 60) { conclusion = '可轻仓'; conclusionClass = 'over-moderate'; }
  else if (score >= 45) { conclusion = '观望'; conclusionClass = 'over-watch'; }
  else { conclusion = '放弃'; conclusionClass = 'over-skip'; }
  
  // 额外终止条件: 80分钟后追3球大
  if (minute > 80 && overUnder >= 3.0 && score >= 60) {
    conclusion = '观望(80min+)';
    conclusionClass = 'over-watch';
  }
  
  return {
    score, maxPossible: 100,
    breakdown,
    sceneScore, rhythmScore, oddsScore, timeScore, riskScore,
    conclusion, conclusionClass,
    terminated: false, terminateReasons: [],
    details: {
      dangerDiff, shotsOnDiff, xgTotal, dangerRatio,
      minute, overUnder, pressureMin, corners,
      oddsMovement, redCard, leaderControl
    }
  };
}

    html += '</div>';
  } else {

    const modules = [
      ['场面压制', result.sceneScore, 35, '#22c55e'],
      ['节奏强度', result.rhythmScore, 25, '#3b82f6'],
      ['Live盘口', result.oddsScore, 20, '#f59e0b'],

    Object.keys(items).forEach(k => {
      const [raw, score, max] = items[k];
      const sc = parseInt(score) || 0;
      let cls = 'low';
      if (sc >= max * 0.8 && max > 0) cls = 'max';
      else if (sc >= max * 0.5 && max > 0) cls = 'high';
      else if (sc > 0) cls = 'mid';

      html += '<span class="over-detail-label">  ' + k + '</span>';
      html += '<span style="font-size:11px;color:#94a3b8;">' + raw + '</span>';
      html += '<span class="over-detail-val ' + cls + '">' + (sc >= 0 ? '+' : '') + sc + (max > 0 ? '/' + max : '') + '</span>';
      html += '</div>';

    html += '<hr style="margin:8px 0;border-color:#e5e7eb;">';
    html += '<div style="font-size:11px;color:#64748b;text-align:center;">';
    html += '🔑 真大球: 压制持续 + xG真实 + 盘口不退 | 假大球: 热闹多 + xG低 + 盘口降';
    html += '</div>';
  }
  
  document.getElementById('overDetailTitle').textContent = '滚球大球评分 · ' + m.homeTeam + ' vs ' + m.awayTeam;

  document.getElementById('overDetailOverlay').classList.add('active');

function computeJudgment(match) {
  let suppress = '';
  let balanced = '';
  const minuteNum = parseInt(match.minute) || 0;
  const scoreStr = match.homeGoal + '-' + match.awayGoal;
  const danger = parseRatio(match.dangerAttacks);
  const dangerRatio = danger ? danger.ratio : 0;
  if (scoreStr === '0-0' && dangerRatio >= 3 && minuteNum >= 20) {
    suppress = '压制不进球';
  }
  if (dangerRatio > 0 && Math.abs(dangerRatio - 1) < 0.5) {
    balanced = '数据均衡，别碰';
  }
  return { suppress, balanced };
}

function simulateLiveData(match) {
  const status = getMatchStatus(match.minute);
  if (status === 'live') {
    const rnd = Math.random();
    if (rnd < 0.03) {
      match.homeGoal = (parseInt(match.homeGoal)||0) + 1;
      match._lastEvent = '⚽ ' + match.homeTeam + ' 进球！';
    } else if (rnd < 0.05) {
      match.awayGoal = (parseInt(match.awayGoal)||0) + 1;
      match._lastEvent = '⚽ ' + match.awayTeam + ' 进球！';
    }
  }
  return match;
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  if (matches.length === 0) {
    tbody.innerHTML = `<tr><td colspan="17"><div class="empty-state">
      <h2>📋 尚无比赛数据</h2><p>点击「添加比赛」录入一场比赛，或点击「载入演示数据」查看示例</p>
    </div></td></tr>`;
    updateStats();
    return;
  }
  let html = '';
  let alertCount = 0;
  matches.forEach((m, idx) => {
    const danger = parseRatio(m.dangerAttacks);
    const dangerDisplay = danger ? danger.home + ':' + danger.away : m.dangerAttacks || '--';
    const dangerRatio = danger ? danger.ratio.toFixed(2) : '--';
    const j = computeJudgment(m);
    if (j.suppress || j.balanced) alertCount++;
    
    const overResult = computeOverScore(m);
    if (overResult.conclusion === '强追大球' || overResult.conclusion === '可轻仓') alertCount++;
    
    let rowClass = 'row-normal';
    if (j.suppress) rowClass = 'row-warn';
    else if (j.balanced) rowClass = 'row-blue';
    else if (overResult.conclusionClass === 'over-strong') rowClass += ' row-over-strong';
    else if (overResult.conclusionClass === 'over-moderate') rowClass += ' row-over-moderate';
    else if (overResult.conclusionClass === 'over-skip') rowClass += ' row-over-skip';
    else if (overResult.conclusionClass === 'over-blocked') rowClass += ' row-over-skip';
    const status = getMatchStatus(m.minute);
    const statusBadge = getStatusBadge(status);
    const suppressHTML = j.suppress
      ? '<span class="badge badge-warn">⚠️ ' + j.suppress + '</span>'
      : '<span class="badge-none">-</span>';
    const balancedHTML = j.balanced
      ? '<span class="badge badge-blue">🔵 ' + j.balanced + '</span>'
      : '<span class="badge-none">-</span>';
    const xgDisplay = (m.xgHome || '0') + ' / ' + (m.xgAway || '0');
    
    const overScoreHTML = (status === 'live')
      ? '<span class="over-score-badge ' + overResult.conclusionClass + '" onclick="showOverDetail(' + idx + ')" title="点击查看评分详情">' + overResult.score + '</span>'
      : '<span style="color:#94a3b8;">--</span>';
    const overConclusionHTML = (status === 'live')
      ? '<strong style="font-size:12px;color:' + (overResult.conclusionClass === 'over-strong' ? '#166534' : overResult.conclusionClass === 'over-moderate' ? '#854d0e' : overResult.conclusionClass === 'over-skip' ? '#991b1b' : '#64748b') + ';">' + overResult.conclusion + '</strong>'
      : '<span style="color:#94a3b8;">--</span>';
    
    html += `<tr class="${rowClass}">
      <td><span class="match-time">${m.minute}'</span></td>
      <td>${m.league}</td>
      <td><span class="team-name home-team">${m.homeTeam}</span></td>
      <td><span class="team-name away-team">${m.awayTeam}</span></td>
      <td><span class="score">${m.homeGoal}-${m.awayGoal}</span></td>
      <td>${m.handicap}</td>
      <td>${m.overUnder}</td>
      <td class="stat-ratio">${m.shots || '--'}</td>
      <td class="stat-ratio">${m.shotsOn || '--'}</td>
      <td>
        <span class="stat-ratio">${dangerDisplay}</span>
        <span style="font-size:11px;color:#64748b;margin-left:4px;">(${dangerRatio})</span>
      </td>
      <td>${xgDisplay}</td>
      <td>${overScoreHTML}</td>
      <td>${overConclusionHTML}</td>
      <td>${suppressHTML}</td>
      <td>${balancedHTML}</td>
      <td>${statusBadge}</td>
      <td>
        <button class="btn btn-sm" onclick="editMatch(${idx})">编辑</button>
        <button class="btn btn-sm btn-danger" onclick="deleteMatch(${idx})">删除</button>
      </td>
    </tr>`;
  });
  tbody.innerHTML = html;
  updateStats(alertCount);
}

  document.getElementById('alertCount').textContent = alertCount;

    homeTeam: document.getElementById('f_home').value.trim(),
    awayTeam: document.getElementById('f_away').value.trim(),

    shotsOn: document.getElementById('f_shotsOn').value.trim(),

    return;

// ===== JSON导入功能 =====

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.matches || !Array.isArray(data.matches)) {
        alert('JSON格式不正确，需要包含 "matches" 数组。请使用抓取器生成的 match_data.json');
        return;
      }
      showImportPreview(data);
    } catch(err) {
      alert('JSON解析失败: ' + err.message);
    }
  };
  reader.readAsText(file);
  // 重置file input，允许重复导入同一文件
  event.target.value = '';
}

function showImportPreview(data) {
  const matchList = data.matches;
  const fetchTime = data.fetch_time_display || data.fetch_time || '未知';
  
  // 构建预览HTML
  let previewHTML = '<div class="import-preview-list">';
  previewHTML += '<p style="font-size:12px;color:#64748b;margin-bottom:8px;">抓取时间: ' + fetchTime + ' | 共 ' + matchList.length + ' 场</p>';
  
  matchList.slice(0, 10).forEach(m => {
    previewHTML += '<div style="font-size:12px;padding:4px 0;border-bottom:1px solid #f1f5f9;">' +
      (m.league || '?') + ' | ' + (m.home_team || m.homeTeam || '?') + ' vs ' + (m.away_team || m.awayTeam || '?') +
      ' | ' + (m.live_score || m.score || '-') + ' | ' + (m.match_status || m.status || '?') +
      '</div>';
  });
  if (matchList.length > 10) {
    previewHTML += '<div style="font-size:12px;padding:4px 0;color:#64748b;">... 还有 ' + (matchList.length - 10) + ' 场</div>';
  }
  previewHTML += '</div>';
  
  // 显示预览弹窗
  const overlay = document.getElementById('importPreviewOverlay');
  document.getElementById('importPreviewContent').innerHTML = previewHTML;
  document.getElementById('importPreviewCount').textContent = matchList.length;
  overlay.classList.add('active');
  
  // 存储待导入的数据
  overlay._importData = data;
}

function confirmImport() {
  const overlay = document.getElementById('importPreviewOverlay');
  const data = overlay._importData;
  if (!data) return;
  
  const replaceExisting = document.getElementById('importReplace').checked;
  const matchList = data.matches;
  
  if (replaceExisting) {
    matches = [];
  }
  
  let imported = 0;
  matchList.forEach(m => {
    // 字段映射: 抓取器JSON → 战术板格式
    const score = parseScore(m.live_score || m.score || '');
    const match = {
      minute: mapMatchMinute(m.match_time || m.time || '', m.match_status || m.status || ''),
      league: m.league || '',
      homeTeam: m.home_team || m.homeTeam || '',
      awayTeam: m.away_team || m.awayTeam || '',
      homeGoal: score.home,
      awayGoal: score.away,
      handicap: m.live_asian_handicap || m.handicap || '',
      overUnder: m.live_over_under || m.overUnder || '',
      shots: m.shots_ratio || m.shots || '',
      shotsOn: m.shots_on_target_ratio || m.shotsOn || '',
      dangerAttacks: m.danger_attacks_ratio || m.dangerAttacks || '',
      xgHome: m.home_xg || m.xgHome || '',
      xgAway: m.away_xg || m.xgAway || '',
      pressureMin: m.pressureMin || '',
      corners: m.corners || '',
      redCard: m.redCard || '',
      leaderControl: m.leaderControl || '',
      oddsMovement: m.oddsMovement || '',
      createdAt: new Date().toISOString(),
      _source: m.notes || m.source || '',
    };
    
    // 跳过没有队名的
    if (!match.homeTeam || !match.awayTeam) return;
    
    // 去重检查
    const dup = matches.find(existing =>
      existing.homeTeam === match.homeTeam && existing.awayTeam === match.awayTeam
    );
    if (!dup) {
      matches.push(match);
      imported++;
    }
  });
  
  saveData();
  renderTable();
  
  overlay.classList.remove('active');
  alert('导入完成: ' + imported + ' 场比赛 (跳过 ' + (matchList.length - imported) + ' 场重复)');
}

function cancelImport() {
  document.getElementById('importPreviewOverlay').classList.remove('active');
}

function parseScore(scoreStr) {
  if (!scoreStr) return { home: 0, away: 0 };
  const parts = scoreStr.toString().trim().split(/[-:]/);
  if (parts.length === 2) {
    const home = parseInt(parts[0]);
    const away = parseInt(parts[1]);
    if (!isNaN(home) && !isNaN(away)) return { home, away };
  }
  return { home: 0, away: 0 };
}

function mapMatchMinute(timeStr, status) {
  // 将比赛时间映射为分钟数或状态标识
  if (status === '已结束' || status === 'finished') return 'FT';
  if (status === '未开赛' || status === 'scheduled') return '0';
  if (status === '进行中' || status === 'live') {
    // 尝试从时间中提取分钟 (格式可能是 "HH:MM" 或 "分钟'")
    const minMatch = timeStr.match(/(\d+)['\']?/);
    if (minMatch) return minMatch[1];
    return 'live';
  }
  return '0';
}

init();
</script>
